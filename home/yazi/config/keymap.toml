# ======================================
# Custom
# ======================================

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/dotfiles"
desc = "Go ~/dotfiles"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "cd ~/notes"
desc = "Go ~/notes"

[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd ~/mnt"
desc = "Go ~/mnt"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to git repo root"

[[mgr.prepend_keymap]]
on   = [ "g", "x" ]
run  = "cd ~/nixos"
desc = "Go ~/nixos"

# ======================================
# lazygit.yazi
# ======================================

[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "plugin lazygit"
desc = "Run lazygit"

# ======================================
# open-git-remote.yazi
# ======================================

[[mgr.prepend_keymap]]
on   = [ "g", "o" ]
run  = "plugin open-git-remote"
desc = "Open git remote in browser"

# ======================================
# sshfs.yazi
# ======================================

[[mgr.prepend_keymap]]
on   = [ "M", "s" ]
run  = "plugin sshfs -- menu"
desc = "Open SSHFS options"
